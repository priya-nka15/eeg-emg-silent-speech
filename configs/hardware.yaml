# URF/A-SSR Hardware Configuration
# Version: 1
# Date: 2026-10-08
#
# IMPORTANT: All TBD fields must be filled from verified hardware documentation.
# Do not invent values. Record updates in docs/decision_log.md.
# The actual PCB schematic is authoritative for all wiring and hardware details.

hardware_config_version: "1"

# ─── AFE ────────────────────────────────────────────────────────────────────
afe:
  family: "ADS1298-class"         # EVIDENCE-BACKED: TI ADS1298 family
  part_number: "TBD"              # HARDWARE-TBD: exact purchased/assembled part
  channels_total: 8               # EVIDENCE-BACKED: ADS1298 family is 8-channel
  channels_used: 6                # FROZEN: 6 biopotential channels
  resolution_bits: 24             # EVIDENCE-BACKED
  acquisition_mode: "simultaneous"  # EVIDENCE-BACKED
  sample_rate_range_sps:          # EVIDENCE-BACKED: ADS1298 datasheet range
    min: 250
    max: 32000

# ─── MCU ────────────────────────────────────────────────────────────────────
mcu:
  family: "ESP32-S3"              # FROZEN
  module: "TBD"                   # HARDWARE-TBD: exact module/variant
  firmware_revision: "TBD"        # HARDWARE-TBD

# ─── PCB ────────────────────────────────────────────────────────────────────
pcb:
  revision: "TBD"                 # HARDWARE-TBD

# ─── SAMPLING ───────────────────────────────────────────────────────────────
sampling:
  target_rate_hz: 4000            # PROJECT-TARGET: 4 kSPS
  # Derived values at 4 kSPS:
  sample_interval_us: 250
  samples_per_second: 4000
  samples_per_500ms: 2000
  samples_per_1s: 4000
  samples_per_2s: 8000
  # Measured rate must be verified from counter/timestamps — not assumed:
  measured_rate_hz: null          # HARDWARE-TBD: set after H2 validation

# ─── GAIN ───────────────────────────────────────────────────────────────────
gain:
  eeg: "TBD"                      # HARDWARE-TBD
